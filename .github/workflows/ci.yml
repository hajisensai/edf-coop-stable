name: CI

# Builds EDF6Coop.dll (one build for every room size) and runs every test that needs no game. CI has neither the game's
# menu layout (multislot/assets/LYT_MAINFRAME.SGO, made from Root.cpk) nor EDF.dll: build.ps1 -CI
# (MULTISLOT_CI=ON) embeds a placeholder layout that package.ps1 and the release workflow refuse, and the
# tests against the game's code (PatchTablesMatchEDF, PluginLoad_*) report themselves skipped, which ctest
# lists at the end of its output. Release packages are built with the game by release.ps1.
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'multislot/**'
      - 'build.ps1'
      - 'sign-update.ps1'
      - '.github/workflows/ci.yml'
      - '.github/loader-fix-requirements.txt'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'multislot/**'
      - 'build.ps1'
      - 'sign-update.ps1'
      - '.github/workflows/ci.yml'
      - '.github/loader-fix-requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Fetch EDFModLoader (pinned by hash)
        shell: pwsh
        run: ./multislot/tools/fetch_modloader.ps1

      # The build runs multislot/tools/fix_winmm_proxy.py on the loader, which needs pefile and capstone. The
      # runner has several Pythons and CMake would pick its own, so the build is told which one has them.
      - name: Install the loader-fix tools (pinned by hash)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r .github/loader-fix-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'pip install failed' }
          "LOADER_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> $env:GITHUB_ENV

      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -Test -CI

      - name: Say which tests were skipped
        shell: pwsh
        run: |
          $listed = & ctest --test-dir multislot/build --show-only=json-v1 | ConvertFrom-Json
          $game = $listed.tests | Where-Object { $_.name -like 'PatchTablesMatchEDF' -or $_.name -like 'PluginLoad_*' }
          $names = ($game | ForEach-Object { $_.name }) -join ', '
          Write-Output "::warning title=Game tests skipped::No EDF.dll in CI, so these ran as skipped: $names. Run build.ps1 -Test on a machine with the game to cover them."
