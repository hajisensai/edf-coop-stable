name: Release

# Signs and publishes a draft Release made by release.ps1 (run it with the game installed: release packages
# need the game's menu asset, which cannot be on a build server).
#   1. release.ps1 -Upload       builds, tests and packages every room size, creates the DRAFT Release vX.Y.Z
#   2. gh workflow run release.yml -f tag=vX.Y.Z
# This workflow checks the draft (every room size present, the zips match their .sha256, each zip carries
# exactly the EDF6Coop-<N>p.dll asset, no CI placeholder build), signs each DLL's update manifest and
# publishes the Release as latest. The tagged commit must be on main; the release text is
# release-notes/X.Y.Z.md. The signing key is only in the sign job, which has a read-only token.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the draft Release (vX.Y.Z)'
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}
  PLAYERS: '8 10 12 16 24 32'

jobs:
  fetch:
    runs-on: windows-latest
    # Draft Releases are visible only with write access.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Tag, main and version agree
        id: check
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw "tag $env:TAG is not vX.Y.Z" }
          $version = $env:TAG.Substring(1)
          $sha = git rev-parse "$env:TAG^{commit}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor $sha origin/main
          if ($LASTEXITCODE -ne 0) { throw "$sha is not an ancestor of origin/main; release from main only" }
          if (-not (Test-Path "release-notes/$version.md")) { throw "missing release-notes/$version.md" }
          if ((Get-Content multislot/CMakeLists.txt -Raw) -notmatch "project\(EDF6Coop VERSION $([regex]::Escape($version))[\s)]") {
            throw "multislot/CMakeLists.txt does not declare EDF6Coop $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $draft = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0) { throw "no Release $env:TAG; create it with release.ps1 -Upload" }
          if ($draft -ne 'true') { throw "Release $env:TAG is already published; publish a new version instead" }
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir draft
          if ($LASTEXITCODE -ne 0) { throw 'gh release download failed' }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: draft
          path: draft/*
          if-no-files-found: error

  sign:
    needs: fetch
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: draft
          path: draft

      - name: Check the packages
        shell: pwsh
        env:
          VERSION: ${{ needs.fetch.outputs.version }}
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($n in $env:PLAYERS -split ' ') {
            $dll = "draft/EDF6Coop-${n}p.dll"
            $zip = "draft/EDF6Coop-$env:VERSION-${n}p.zip"
            foreach ($f in $dll, $zip, "$zip.sha256") { if (-not (Test-Path $f)) { throw "the draft has no $(Split-Path -Leaf $f)" } }
            $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash
            if ((Get-Content "$zip.sha256" -Raw).Split(' ')[0] -ne $zipHash) { throw "$zip does not match its .sha256" }
            $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
            try {
              $entry = $archive.GetEntry('Mods/Plugins/EDF6Coop.dll')
              if (-not $entry) { throw "$zip has no Mods/Plugins/EDF6Coop.dll" }
              $stream = $entry.Open()
              try { $inZip = [BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash($stream)).Replace('-', '') }
              finally { $stream.Dispose() }
            } finally { $archive.Dispose() }
            if ($inZip -ne (Get-FileHash $dll -Algorithm SHA256).Hash) { throw "$zip carries another EDF6Coop.dll than $dll" }
            if ([Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Resolve-Path $dll).Path)).Contains('MULTISLOT CI PLACEHOLDER')) {
              throw "$dll is a CI placeholder build"
            }
          }

      # The signing key reaches this step only; it fails (and so does the job) when the key is missing, does
      # not match the updater's public key, a DLL is not the right room size and version, or a signature
      # does not verify.
      - name: Sign the update manifests
        shell: pwsh
        env:
          VERSION: ${{ needs.fetch.outputs.version }}
          EDF6DN_UPDATE_SIGNING_KEY: ${{ secrets.EDF6DN_UPDATE_SIGNING_KEY }}
        run: |
          New-Item -ItemType Directory -Force signed | Out-Null
          foreach ($n in $env:PLAYERS -split ' ') {
            $dll = "draft/EDF6Coop-${n}p.dll"
            ./sign-update.ps1 -Dll $dll -Version $env:VERSION -Players $n -Updater src/updater.cpp
            Copy-Item "$dll.sig" signed/
            # The auto-updater checks the download against the signed digest; this copy is for people.
            $hash = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -Path "signed/EDF6Coop-${n}p.dll.sha256" -Value "$hash  EDF6Coop-${n}p.dll" -NoNewline -Encoding ascii
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed
          path: signed/*
          if-no-files-found: error

  publish:
    needs: [fetch, sign]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: draft
          path: draft

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed
          path: signed

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.fetch.outputs.version }}
        run: |
          $upload = @()
          foreach ($n in $env:PLAYERS -split ' ') {
            # Each signature covers the hash of exactly the DLL in the draft.
            $hash = (Get-FileHash "draft/EDF6Coop-${n}p.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
            $sig = (Get-Content "signed/EDF6Coop-${n}p.dll.sig" -Raw).Split("`n")
            if ($sig[0] -ne "EDF6Coop $env:VERSION" -or $sig[1] -ne $hash) { throw "EDF6Coop-${n}p.dll.sig does not belong to this DLL and version" }
            $upload += "signed/EDF6Coop-${n}p.dll.sig", "signed/EDF6Coop-${n}p.dll.sha256"
          }
          gh release upload $env:TAG @upload --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'gh release upload failed' }
          # Only now, with every room size signed, may installed copies see it.
          gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'gh release edit failed' }
