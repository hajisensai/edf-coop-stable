[MultiSlot]
; 1 = on, 0 = off (the game is left completely untouched).
Enabled=1
; Player MOD - rooms you create as host. Switched on a menu screen outside a room and saved here; the lower
; left of the menu shows "F2/LS 12Player MOD :ON" or "F2/LS Player MOD :OFF" where it can be switched.
; Each press steps OFF -> 8 -> 10 -> 12 -> 16 -> 24 -> @MULTISLOT_MAX_PLAYERS@ -> OFF.
;   0 = a normal 4-player room that anyone can find and join, exactly as without this mod.
;   8, 10, 12, 16, 24 or @MULTISLOT_MAX_PLAYERS@ = a MultiSlot room for that many players. Players without EDF6Coop 2.3.0 or later cannot
;       see it, and are refused if they try to join through an invite.
; The room list shows both kinds of room, of every size, whatever this setting.
; A room keeps the size it was created with. As a guest you can join both kinds of room, of any size.
; Rooms of more than 16 players have no in-game voice chat: Epic allows a voice chat room only up to 16.
RoomSize=0
; What switches it. F1..F24, Tab, a virtual-key number, or None.
Key=F2
; And the pad button, so a VR controller can reach it. The left stick is free outside a room, which is the
; only place this can be switched. RightStick, LeftStick, Back, Start, X, Y, LB, RB, LT, RT or None.
PadButton=LeftStick
; 1 = write crash details (address and call stack) to EDF6Coop.log.
CrashLog=1
; 1 = also write EDF6Coop-crash.dmp for the first access violation inside the game's own code or this
;     mod's (one per launch, the same file overwritten). Faults in other modules, and the mod's own checks
;     of game memory that it catches itself, write nothing.
;     The dump is written from inside the game while it is failing. If the game happened to hold a lock the
;     dump needs at that moment, writing it cannot finish: the game then sits frozen for up to 30 seconds
;     before the crash goes on without a dump.
;     OFF by default, on purpose: a dump is a copy of the game's memory at that moment, so it can contain
;     the room name, player names and chat text. It never leaves your PC on its own, but it is only worth
;     creating if you have been asked for one. Turn it on when you are helping to chase a crash that the
;     log alone cannot explain - a null pointer whose source is on the stack is one of those.
CrashDump=0
; 1 = detailed diagnostic log for bug reports (default): lobby and P2P events (room capacity, search,
;     joins, EOS SDK messages) and enemy count scaling. 0 = only startup, menu and crash lines.
; EDF6Coop.log keeps at most about 2 MB either way: past that its oldest lines are dropped.
; EDF6Coop.log.queue (256 KB) next to it holds the lines not written to the log yet, so the last lines
; of a game that was killed or crashed past every handler still reach the log at the next start.
NetLog=1
; Experimental: retry a final handshake reply once after NoConnection, allowing delivery after connect.
; Only with 5+ occupied user slots and a locally validated peer. Missing key defaults to 1.
; 0 disables the recovery completely on the next game start, independently of NetLog.
HandshakeRecovery=1
; 1 = stay in the room when the P2P handshake with someone who joined after you never completes (default).
;     Without this the game makes every member except the host leave the room 20 seconds after a newcomer
;     whose connection never comes up joined, however long they had been playing there. With it you stay,
;     the newcomer stays unconnected on your side, and their own game gives up and leaves as before.
;     Someone whose own join fails still leaves, as always. Missing key defaults to 1.
; 0 = leave the room as the game does. Takes effect on the next game start, independently of NetLog.
KeepRoomOnPeerTimeout=1

[Smoothing]
; How much of the gap a remote player's drawn position closes each update, as a percentage. 0 = off.
; Tested on 2026-09-29 and it does NOT help, so leave it alone. The offset you see is not a display
; delay that can be tuned away: two machines simulate a boost or a jump and reach different results, and
; the slide afterwards is the game correcting that. The slide runs at a clamped speed, so this fraction
; has no say in it anyway. Raising it only makes other players jump about and aim harder, not easier.
; Kept only so the finding can be re-checked; there is no reason to turn it on.
RemotePlayerPercent=0

[Update]
; 1 = when the game starts, ask GitHub once whether a newer EDF6VR package has been released, and if so
;     say so in the menu's text field:  NEW EDF6VR 2.0.1 -> 2.1.0 - Update_EDF6VR.bat
;     Nothing is downloaded and nothing is changed - it only reads the release page and tells you, so you
;     can close the game and run Update_EDF6VR.bat yourself. One request, on its own thread, and any
;     failure (offline, blocked, slow) simply shows nothing.
;     0 = do not ask (AutoUpdate above is EDF6Coop's own update and separate from this).
CheckEDF6VR=1

[RoomScreen]
; The room screen shows four members at a time; with more members, these switch pages (the lower left
; of the room screen then shows which keys, e.g. "F3/Tab/RS: Members 5-8").
; Pad button: RightStick, LeftStick, Back, Start, X, Y, LB, RB, LT, RT or None.
; (On the room screen LB/LT already scroll the chat log and RB/RT the mission text.)
PageButton=RightStick
; Keyboard keys, comma separated: F1..F24 (not F2, the Player MOD key), Tab, or virtual-key numbers.
PageKeys=F3,Tab
; Test mode, 1 = on: on the room screen DummyAddKey adds and DummyRemoveKey removes a fake member
; (a copy of the first one) in the room's own member list, so the member panels, the voice chat
; display and anything else that reads the members run with 5-@MULTISLOT_MAX_PLAYERS@ members on one machine.
; Only your game sees them and nothing is sent online, but leave this off for normal play.
DummyMembers=0
DummyAddKey=F6
DummyRemoveKey=F7

[Mission]
; 1 = missions support players 5-@MULTISLOT_MAX_PLAYERS@ (their loadouts, player objects, spawn points). With four or
; fewer players the game behaves exactly as without the mod. 0 = leave mission code untouched
; (then only rooms of up to four players can start a mission safely).
Extend=1
; Online missions with 5-@MULTISLOT_MAX_PLAYERS@ players (fixed rules, the same for everyone):
;   enemy durability, damage and speed: as with 4 players (5-@MULTISLOT_MAX_PLAYERS@ players add nothing);
;   only the enemy counts below grow with the team.
; 1 = enemy counts grow by x0.2 for every player above four: 5 x1.2, 8 x1.8, 12 x2.6, 16 x3.4, 24 x5.0,
;     32 x6.6, rounded (a count of 1 stays 1 up to 6 players). Nests, anchors, ships, pods, eggs and other fixed objects never multiply; enemies a
;     mission places one at a time are not duplicated yet.
; 0 = counts as with 4 players. Everyone in a room must use the same setting.
ExtraEnemies=1

[CopyArmor]
; F4 or the left stick, in a room, turns "copy armor" on and off. While it is on, your armor follows the
; lowest armor among the other members of the room: of your own class if anyone else plays it, otherwise of
; the whole room. It only ever raises your armor, never lowers it, and it follows along when anyone changes
; class. Meant for someone who has just started, or for a class they have not levelled, so they are not
; fragile in a group.
; Nothing is written to your save, and the room keeps showing your real armor to you and to everyone else -
; only the mission gets the raised one. The menu's lower left says what you are being given, e.g.
; "F4/LS copy armor :2500(Max)". Turning it off, or leaving the room, puts everything back.
; 0 = the feature is not installed at all (the game's armor code is left completely untouched).
Enabled=1
; It works inside a room, where the page inputs also work, so it may be neither of those, nor F2.
; F1..F24, Tab, a virtual-key number, or None. F5, F9, F11 and F12 are used by EDF6VR; F4 is one of its
; development keys, free while its DevKeys=0.
Key=F4
; And the pad button, so a VR controller can reach it: the stick the page button does not use.
; RightStick, LeftStick, Back, Start, X, Y, LB, RB, LT, RT or None.
PadButton=LeftStick
; How close another member's armor has to be to yours for them to be passed over. Copying someone barely
; different is no help, so the next one up is taken instead: with 3000, 2000, 300 and 200 in the room, the
; 300 and the 200 both reach past each other and copy the 2000. 0 = only pass over exactly equal armor.
IgnoreWithin=300
; The most this may give, per class. It is a rescue for someone who is behind, not a way to someone else's
; armor: a copy above the ceiling is held down to it, and the menu says "(Max)" when that happens.
; 0 = no ceiling for that class.
MaxRanger=4000
MaxWingDiver=2500
MaxAirRaider=3000
MaxFencer=4000

[HostData]
; Weapon pages and the room's weapon files. A weapon page is a folder Mods\Variants\<page name>\ with
; WEAPON\*.SGO and OBJECT\V*.SGO / VEHICLE*.SGO. Each file takes the place of the game's weapon or vehicle
; with the same file name, so the weapon table and your save do not change (no new weapons). Use ASCII
; folder names: the menu font may not show other characters.
; In a room everyone uses the same files: the host's Mods\WEAPON / Mods\OBJECT files and every member's
; page. When two have the same file: the host's Mods first, then the host's page, then the other members'
; pages in join order. They are fetched from each member, checked against the SHA-256 it published, kept
; in Mods\Plugins\EDF6Coop.hostdata (never in your Mods folders) and switched between missions only.
; Leaving the room, quitting or a crash brings back your own files.
; Only data travels: weapon files (not WEAPONTABLE or WEAPONTEXT) and vehicle files, at most 128 files
; and 4 MB per page, up to 16 pages. Never a DLL or a patch. 0 = none of this, and the game's file
; loading is left alone.
Enabled=1
; Offer your Mods weapon and vehicle files (as host) and your page to the room. 0 = offer nothing (you
; still use your page yourself).
Share=1
; When the room's files differ from yours: Always (take them without a key press; the menu says
; "ROOM WEAPONS :ON"), Ask (the menu says "F1 ROOM WEAPONS :OFF"; press AcceptKey to take them) or Never
; (the menu only says "ROOM WEAPONS differ").
Accept=Always
; Only used with Accept=Ask: takes the room's files, and gives them back when pressed again. Between
; missions only. F5, F9, F11 and F12 are used by EDF6VR, F8 by GhostPlayers.
AcceptKey=F1
; On any menu screen, steps through off -> page 1 -> page 2 ... -> off (folder name order). Takes effect
; from the next mission; works offline too. F5, F9, F11 and F12 are used by EDF6VR, F8 by GhostPlayers;
; F6 is also [RoomScreen] DummyAddKey, which only works while DummyMembers=1 (a test).
WeaponPageKey=F6
; The page picked last; F6 writes it. Empty = off.
Page=

[Test]
; Solo test for missions with more than four players (needs Extend=1): when you start a mission
; alone in your own online room, this many idle copies of you join as extra players (0..@MULTISLOT_MAX_GHOSTS@).
; Nothing is sent to anyone. 0 = off.
GhostPlayers=0
; Test of the split start message with few players: as host, keep at most this many bytes of loadout
; records in the start message and send the others beside it (try 200 with two players). 0 = normal.
; Everyone in the room must run EDF6Coop: the game without it cannot read a split start message and
; writes past its player records (measured with the game's own code, tests/gamenet).
SplitSyncBudget=0
